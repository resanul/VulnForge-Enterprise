framework: PCI-DSS-v4.0
description: Payment Card Industry Data Security Standard Technical Controls
rules:
  - rule_id: PCI-2.2.4
    title: Insecure and cleartext protocols are disabled
    severity: High
    check_type: config_match
    expected_value: "disabled"
    remediation: Disable Telnet, FTP, and HTTP in the Cardholder Data Environment.

  - rule_id: PCI-4.1.2
    title: Strong cryptography is used for transmission of cardholder data
    severity: High
    check_type: config_match
    expected_value: "TLSv1.2+"
    remediation: Disallow SSL and TLS 1.0/1.1; enforce TLS 1.2 or TLS 1.3 exclusively.
